name: Build Rust APKs
on:
  push:
    branches: [main]
    paths: ["rust-src.b64", "recorder-src.b64", ".github/workflows/rust.yml"]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - name: Unpack Rust sources
        working-directory: .
        run: |
          rm -rf rust
          mkdir -p rust
          base64 -d rust-src.b64 | tar xz -C rust

      - name: Replace CraftRecorder with the new simplified version
        working-directory: .
        run: |
          rm -rf rust/craftrecorder
          base64 -d recorder-src.b64 | tar xz -C rust

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Android SDK parts
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - name: Install cargo-apk
        run: cargo install cargo-apk --locked

      - name: Generate icons
        run: |
          pip install pillow
          python3 tools/gen_icons.py

      - name: Prepare patched Slint Android backend (pen pressure and buttons)
        run: |
          sed -i 's/^use android_activity::input/use crate::android_activity::input/' tools/pen_patch.rs
          python3 tools/prep_backend.py

      - name: Enable native-activity entry point for CraftRecorder
        run: |
          grep -q native-activity craftrecorder/Cargo.toml || cat >> craftrecorder/Cargo.toml <<'EOF'

          [target.'cfg(target_os = "android")'.dependencies.i-slint-backend-android-activity]
          version = "=1.19.0"
          default-features = false
          features = ["aa-06", "native-activity"]
          EOF

      - name: Build CraftNotes
        run: cargo apk build -p craftnotes --lib --features droid

      - name: Build CraftRecorder
        run: cargo apk build -p craftrecorder --lib --features droid

      - uses: actions/upload-artifact@v4
        with:
          name: CraftNotes-apk
          path: rust/target/debug/apk/CraftNotes.apk
          retention-days: 90

      - uses: actions/upload-artifact@v4
        with:
          name: CraftRecorder-apk
          path: rust/target/debug/apk/CraftRecorder.apk
          retention-days: 90

      - name: Keep only the latest CraftNotes and CraftRecorder APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "/repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select((.name == "CraftNotes-apk" or .name == "CraftRecorder-apk") and ((.workflow_run.id | tostring) != env.GITHUB_RUN_ID)) | .id' |
          while IFS= read -r artifact_id; do
            [ -z "$artifact_id" ] || gh api --method DELETE "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
          done
