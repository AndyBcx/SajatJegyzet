name: Build Rust APKs
on:
  push:
    branches: [main]
    paths: ["rust-src.b64", ".github/workflows/rust.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - name: Unpack Rust sources
        working-directory: .
        run: |
          mkdir -p rust
          base64 -d rust-src.b64 | tar xz -C rust

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Android SDK parts
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - name: Install cargo-apk
        run: cargo install cargo-apk --locked

      - name: Generate icons
        run: |
          pip install pillow
          python3 tools/gen_icons.py

      - name: Build Saját Jegyzet
        run: cargo apk build -p jegyzet --lib --features droid

      - name: Build Saját Hangrögzítő
        run: cargo apk build -p hangrogzito --lib --features droid

      - uses: actions/upload-artifact@v4
        with:
          name: SajatJegyzet-apk
          path: rust/target/debug/apk/SajatJegyzet.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SajatHangrogzito-apk
          path: rust/target/debug/apk/SajatHangrogzito.apk
